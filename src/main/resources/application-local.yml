server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-stream-group-local
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.pedroonietoo.pymt_srv_stream_payments: DEBUG
    org.hibernate.SQL: INFO
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.Metadata: ERROR

app:
  kafka:
    topic-prefix: "pymt-srv"
  outbox:
    polling-interval-ms: 1000
    batch-size: 50
    max-attempts: 3
    kafka-timeout-seconds: 5

resilience4j:
  ratelimiter:
    instances:
      payment-api:
        limitForPeriod: 3
        limitRefreshPeriod: 10s
        timeoutDuration: 0