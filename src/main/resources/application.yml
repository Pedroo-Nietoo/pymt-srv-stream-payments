spring:
  application:
    name: pymt-srv-stream-payments
  profiles:
    active: local
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
info:
  app:
    name: "pymt-srv-stream-payments"
    description: "Microsserviço de ingestão de pagamentos (Event-Driven)"
    version: "1.0.0"
  team:
    name: "Squad Pagamentos"
    contact: "pedroonietoo@gmail.com"

app:
