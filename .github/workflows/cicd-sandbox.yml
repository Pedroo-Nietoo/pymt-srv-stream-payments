name: Workflow Sandbox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_sonar_scan:
        description: Enable SonarQube scan
        required: false
        type: boolean
        default: false
#      enable_deploy_option:
#        description: Enable deploy to Render
#        required: false
#        type: boolean
#        default: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  quality:
    name: Quality and Build
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: ${{ vars.CI_DATABASE_URL || 'jdbc:postgresql://localhost:5432/pymt_srv_test' }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.CI_POSTGRES_USER || 'postgres' }}
      SPRING_DATASOURCE_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'pymt_srv_test' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD || 'pymt_srv_test' }}
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB || 'pymt_srv_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Install dependencies and compile
        run: ./mvnw dependency:go-offline compile -B

      - name: Run tests with coverage (JaCoCo)
        run: ./mvnw verify -B

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Validate Docker image build
        run: docker build --tag pymt-srv-stream-payments:${{ github.sha }} .

  sonar:
    name: SonarQube Scan and Quality Gate
    needs: quality
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.enable_sonar_scan == true ||
        github.event.inputs.enable_sonar_scan == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Compile classes for SonarQube mapping
        run: ./mvnw clean compile -B

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.exclusions=**/generated/**,**/*Config.java,**/*Application.java

      - name: Check SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube summary
        if: success()
        run: echo '### SonarQube Quality Gate passed' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Docker Image
    needs: [quality, sonar]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    #        (
    #          github.event_name == 'workflow_dispatch' &&
    #          (
    #            inputs.enable_deploy_option == true ||
    #            github.event.inputs.enable_deploy_option == 'true'
    #          )
    #        )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

